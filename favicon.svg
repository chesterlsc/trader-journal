<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trader Journal">
  <!-- THE APP'S OWN MARK, measured from the running app rather than guessed.
       .topnav-mark and .lnd-mark both render an off-white tile carrying a
       gunmetal "TJ":

         background   #e9edf1   (the app's text token)
         colour       #14161a   (gunmetal)
         radius       10px on a 46px tile, so 14 on this 64 canvas
         type         700 18px Space Grotesk, so 25 on this canvas
         ring         rgba(218,224,231,0.12) hairline

       An earlier version of this file was a burnt-oxide gradient with white
       type, which matched the accent but not the logo, so the tab did not look
       like the app it opened. Before that it was a blue V2 leftover. The mark
       is light on purpose: it reads on a dark browser chrome and on a light
       one, which an oxide tile does not. -->
  <rect width="64" height="64" rx="14" fill="#e9edf1"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5"
        fill="none" stroke="#dae0e7" stroke-opacity="0.5" stroke-width="1"/>
  <text x="32" y="33.5" fill="#14161a"
        font-family="'Space Grotesk','Sora',system-ui,-apple-system,sans-serif"
        font-size="25" font-weight="700" letter-spacing="0.25"
        text-anchor="middle" dominant-baseline="central">TJ</text>
</svg>
