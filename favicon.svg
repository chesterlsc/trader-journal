<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trader Journal">
  <!-- THE APP'S OWN LOGO, not a second mark.
       .lnd-mark (styles.css) and .topnav-mark (clay-v2.css) both render a
       rounded tile filled with the burnt-oxide accent carrying a white "TJ".
       The previous favicon was a metal tile with a BLUE #3b82f6 monogram, a
       leftover from the V2 palette, so the browser tab did not match the
       product it opened. Values below are the shipped ones:
         --accent-strong #f68d5c -> --accent #f0763d   (the .lnd-mark gradient)
         --radius-clay-sm, scaled to this canvas
       Weight and letter-spacing follow the mark's `font: 700 15px/1` at 38px,
       scaled to 64. -->
  <defs>
    <linearGradient id="oxide" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f68d5c"/>
      <stop offset="100%" stop-color="#f0763d"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="20" fill="url(#oxide)"/>
  <!-- The inset highlight the mark gets from --clay-accent. -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="19.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <text x="32" y="33" fill="#ffffff"
        font-family="'Space Grotesk','Sora',system-ui,-apple-system,sans-serif"
        font-size="26" font-weight="700" letter-spacing="0.26"
        text-anchor="middle" dominant-baseline="central">TJ</text>
</svg>
